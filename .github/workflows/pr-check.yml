name: pr-check
# Untrusted: runs with the pull request's code and a read-only token. It only runs the listed plugins'
# own tests, as an informational badge. The decision is made by the trusted `review` workflow.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install -g @anthropic-ai/claude-code@2.1.288
      - name: Run the listed plugins' tests
        run: pnpm scanner tests --base "origin/${{ github.event.pull_request.base.ref }}" --out test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
